function colorFade(t){ // motivated film fades and short smooth dissolves
 let stops=[0,2.92,5,8.03,11,15.01,18.48,20];let a=0;
 for(let i=1;i<stops.length-1;i++){let v=Math.abs(t-stops[i]);if(v<.12)a=Math.max(a,(.12-v)/.12*.30)}
 if(t<.45)a=Math.max(a,1-eased(t,0,.45));if(t>19.73)a=Math.max(a,eased(t,19.73,20));
 rect(0,0,W,H,`rgba(3,4,15,${a})`);
}
function renderFrame(t){t=clamp(t,0,D);ctx.clearRect(0,0,W,H);
 if(t<2.92)shotHome(t);
 else if(t<5)shotArrival(t);
 else if(t<8.03)shotTheft(t);
 else if(t<11)shotFlee(t);
 else if(t<15.01)shotPacking(t);
 else if(t<18.48)shotJourney(t);
 else shotTitle(t);
 vignette(.72); // darker lens edges for cinematic contrast; not an effect on the characters
 // slim soft cinemascope bars leave sufficient 16:9 play area
 rect(0,0,W,55,'#03040e');rect(0,845,W,55,'#03040e');
 // No speech or subtitles. The physical action tells the story.
 colorFade(t);
}
window.renderFrame=renderFrame;
let clock=null,paused=true,currentTime=0,frameId=0;
const audio=document.getElementById('soundtrack');audio.volume=.86;const playBtn=document.getElementById('start');
function tick(now){if(paused)return;if(clock===null)clock=now-currentTime*1000;currentTime=Math.min(D,(now-clock)/1000);renderFrame(currentTime);if(currentTime>=D){pause();complete();return}frameId=requestAnimationFrame(tick)}
function play(){if(!paused)return;paused=false;clock=null;if(currentTime>=D)currentTime=0;audio.currentTime=Math.min(audio.duration||20,currentTime);audio.play().catch(()=>{});playBtn.style.display='none';frameId=requestAnimationFrame(tick)}
function pause(){paused=true;audio.pause();cancelAnimationFrame(frameId)}
function seek(t){currentTime=clamp(t,0,D);if(!isNaN(audio.duration))audio.currentTime=Math.min(currentTime,audio.duration);clock=null;renderFrame(currentTime)}
function complete(){window.dispatchEvent(new CustomEvent('devildomain:intro-complete',{detail:{chapter:1}}));if(typeof window.onDevilDomainIntroComplete==='function')window.onDevilDomainIntroComplete();playBtn.textContent='↻ REPLAY INTRO';playBtn.style.display='inline-block'}
function skip(){pause();seek(D);complete()}
window.DevilDomainIntro={play,pause,seek,skip,onComplete(fn){window.onDevilDomainIntroComplete=fn}};
playBtn.addEventListener('click',play);document.getElementById('skip').addEventListener('click',skip);document.getElementById('sound').addEventListener('click',()=>{audio.muted=!audio.muted;document.getElementById('sound').textContent=audio.muted?'SOUND OFF':'SOUND ON'});
renderFrame(0);if(capture){playBtn.style.display='none';}
