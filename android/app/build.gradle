apply plugin: 'com.android.application'

// Signing credentials live outside the project and are never bundled.
def signingFile = new File(System.getProperty('user.home'), '.devil-domain-signing/release.properties')
def releaseKeys = new Properties()
if (signingFile.exists()) signingFile.withInputStream { releaseKeys.load(it) }

android {
    namespace = "com.janawad.devildomain"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.janawad.devildomain"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        manifestPlaceholders = [appLabel: 'Devil Domain']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        production {
            if (!releaseKeys.isEmpty()) {
                storeFile file(releaseKeys['storeFile'])
                storePassword releaseKeys['storePassword']
                keyAlias releaseKeys['keyAlias']
                keyPassword releaseKeys['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.production
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        playtest {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-test'
            manifestPlaceholders = [appLabel: 'Devil Domain Test']
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Always regenerate a production-only asset overlay, even after a developer cap sync.
// Android's release source set overrides main/assets/public/game-config.js.
android.sourceSets.release.assets.srcDir(layout.buildDirectory.dir('generated/releaseWeb/assets'))
android.sourceSets.playtest.assets.srcDir(layout.buildDirectory.dir('generated/releaseWeb/assets'))
def generateReleaseWebAssets = tasks.register('generateReleaseWebAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/build.js', '--android-release'
    outputs.upToDateWhen { false }
}
tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'mergeReleaseAssets', 'prePlaytestBuild', 'mergePlaytestAssets']) {
        task.dependsOn(generateReleaseWebAssets)
    }
    if (task.name in ['preReleaseBuild', 'prePlaytestBuild']) {
        task.doFirst { if (releaseKeys.isEmpty()) throw new GradleException('Release signing file is missing: ' + signingFile) }
    }
}
